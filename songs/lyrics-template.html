<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrics · LMT Korean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ——— 全域變數 (與首頁一致) ——— */
        :root {
            --bg-primary: #0b0b10;
            --bg-secondary: #111118;
            --bg-card: #181822;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e4dfd8;
            --text-secondary: #a09a94;
            --text-muted: #6b6660;
            --accent-gold: #c9a96e;
            --accent-gold-dim: rgba(201, 169, 110, 0.12);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        /* ——— 導航 (與首頁一致) ——— */
        .nav-bar {
            background: rgba(11, 11, 16, 0.75);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border-bottom: 1px solid var(--border-subtle);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
        }

        .nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }
        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        .mobile-nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .mobile-nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .mobile-nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        /* ——— 返回按鈕 ——— */
        .back-btn {
            color: var(--text-muted);
            transition: color 0.2s ease;
            text-decoration: none;
        }
        .back-btn:hover {
            color: var(--text-primary);
        }

        /* ——— 標籤 ——— */
        .label-text {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .gold-line {
            width: 40px;
            height: 2px;
            background: var(--accent-gold);
            opacity: 0.4;
            border-radius: 2px;
        }

        /* ——— 歌詞行 ——— */
        .lyric-line {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.5rem;
            transition: all 0.25s ease;
            cursor: pointer;
            box-shadow: var(--shadow-card);
        }
        .lyric-line:hover {
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }
        .lyric-line.active {
            border-color: rgba(201, 169, 110, 0.2);
            background: rgba(201, 169, 110, 0.04);
            box-shadow: 0 0 0 1px rgba(201, 169, 110, 0.06), var(--shadow-card);
        }

        .korean-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.1rem;
            font-weight: 450;
            color: #d4c5a0;
            line-height: 1.6;
        }
        .translation-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 0.15rem;
        }

        /* ——— 分析面板 (桌面) ——— */
        .analysis-panel {
            position: sticky;
            top: 85px;
            height: calc(100vh - 110px);
            overflow-y: auto;
        }

        .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: var(--shadow-card);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }
        .panel-title svg {
            width: 1.1rem;
            height: 1.1rem;
            color: var(--accent-gold);
            opacity: 0.7;
        }

        .analysis-point {
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .analysis-point:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .analysis-point strong {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: #d4c5a0;
            margin-bottom: 0.15rem;
        }
        .analysis-point span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* ——— 行動版摺疊分析 ——— */
        .analysis-mobile {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), margin-top 0.4s ease;
            margin-top: 0;
        }
        .analysis-mobile.open {
            max-height: 600px;
            margin-top: 0.75rem;
        }
        .analysis-mobile .analysis-point {
            padding: 0.4rem 0;
        }
        .analysis-mobile .analysis-point strong {
            font-size: 0.8rem;
        }
        .analysis-mobile .analysis-point span {
            font-size: 0.75rem;
        }

        /* ——— 核心單字 ——— */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem 1.5rem;
        }
        .vocab-item {
            font-size: 0.85rem;
        }
        .vocab-item .ko {
            font-weight: 500;
            color: #d4c5a0;
        }
        .vocab-item .detail {
            color: var(--text-secondary);
        }
        .vocab-item .pos {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        /* ——— 按鈕 ——— */
        .btn-copy {
            background: var(--accent-gold);
            color: #0b0b10;
            font-weight: 500;
            font-size: 0.75rem;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            border: none;
            transition: all 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-copy:hover {
            background: #dbb87a;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(201, 169, 110, 0.15);
        }

        /* ——— 通知 ——— */
        .copy-notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(1rem);
            background: var(--accent-gold);
            color: #0b0b10;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: 0 8px 28px rgba(201, 169, 110, 0.2);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .copy-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ——— 滾動條 ——— */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d3d4a;
        }

        /* ——— 響應式 ——— */
        @media (max-width: 768px) {
            .lyric-line {
                padding: 0.75rem 1rem;
            }
            .korean-text {
                font-size: 0.95rem;
            }
            .translation-text {
                font-size: 0.8rem;
            }
            .analysis-panel {
                position: relative;
                top: 0;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <header class="nav-bar">
        <nav class="max-w-6xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <a href="../index.html" class="flex items-center gap-2 text-white font-medium text-sm tracking-tight">
                    <span class="text-[#c9a96e]">◆</span>
                    <span>LMT</span>
                    <span class="text-[#6b6660] font-light text-xs hidden sm:inline">· korean</span>
                </a>

                <div class="hidden md:flex items-center gap-0.5">
                    <a href="../index.html" class="nav-link">Home</a>
                    <a href="../grammar/index.html" class="nav-link">Grammar</a>
                    <a href="../vocabulary/index.html" class="nav-link">Vocabulary</a>
                    <a href="./index.html" class="nav-link active">Lyrics</a>
                </div>

                <button id="menu-toggle" aria-label="Menu" class="md:hidden text-[#a09a94] hover:text-[#e4dfd8] p-1.5 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>

            <div id="mobile-menu" class="md:hidden hidden pb-3 space-y-1">
                <a href="../index.html" class="mobile-nav-link">Home</a>
                <a href="../grammar/index.html" class="mobile-nav-link">Grammar</a>
                <a href="../vocabulary/index.html" class="mobile-nav-link">Vocabulary</a>
                <a href="./index.html" class="mobile-nav-link active">Lyrics</a>
            </div>
        </nav>
    </header>

    <!-- ===== BACK BUTTON ===== -->
    <a href="./index.html" class="back-btn fixed top-20 left-4 md:top-24 md:left-8 z-40 p-1.5 transition" title="Back to song list">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z" />
        </svg>
    </a>

    <!-- ===== MAIN ===== -->
    <main class="max-w-6xl mx-auto px-6 lg:px-8 pt-20 pb-10 w-full">
        <div id="song-container" class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- 左欄：歌詞 -->
            <div class="lg:col-span-2" id="lyrics-column">
                <div class="text-center text-[#6b6660] text-sm py-8">Loading song...</div>
            </div>

            <!-- 右欄：分析面板 (桌面) -->
            <div class="hidden lg:block">
                <div class="analysis-panel">
                    <div class="panel-card" id="analysis-panel">
                        <div class="panel-title">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                            </svg>
                            Analysis
                        </div>
                        <div id="analysis-content">
                            <p class="text-[#6b6660] text-sm">Click a lyric line to see breakdown.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 核心單字 (所有尺寸) -->
        <div id="key-vocab-panel" class="panel-card mt-10 hidden">
            <div class="panel-title">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v11.494m-9-5.747h18" />
                </svg>
                Key Vocabulary
            </div>
            <div id="key-vocab-content" class="vocab-grid"></div>
        </div>
    </main>

    <!-- ===== COPY NOTIFICATION ===== -->
    <div id="copy-notification" class="copy-notification">Lyrics copied!</div>

    <!-- ===== FOOTER ===== -->
    <footer class="border-t border-[#1a1a24] bg-[#0b0b10] py-7 mt-4">
        <div class="max-w-6xl mx-auto px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p class="text-[#6b6660] text-[0.65rem] font-light tracking-wide">
                &copy; <span id="year"></span> LMT · Korean Learning
            </p>
            <div class="flex items-center gap-5 text-[0.65rem] text-[#6b6660]">
                <a href="#" class="hover:text-[#a09a94] transition">L</a>
                <a href="#" class="hover:text-[#a09a94] transition">M</a>
                <a href="#" class="hover:text-[#a09a94] transition">T</a>
            </div>
        </div>
    </footer>

    <script>
        // ——— 核心邏輯 (功能保留，樣式統一) ———
        var currentSong = null;

        function sanitize(str) {
            if (typeof str !== 'string') return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showNotification() {
            var n = document.getElementById('copy-notification');
            if (!n) return;
            n.classList.add('show');
            setTimeout(function() { n.classList.remove('show'); }, 2000);
        }

        function copyLyrics(text, btn) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                if (btn) {
                    var orig = btn.innerHTML;
                    btn.innerHTML = '✓ Copied';
                    btn.disabled = true;
                    setTimeout(function() {
                        btn.innerHTML = orig;
                        btn.disabled = false;
                    }, 2000);
                }
                showNotification();
            } catch (e) {
                console.error(e);
                alert('Failed to copy lyrics.');
            }
            document.body.removeChild(ta);
        }

        function updateDesktopAnalysis(lineIndex) {
            var content = document.getElementById('analysis-content');
            if (!content || !currentSong || !currentSong.lines[lineIndex]) return;

            var line = currentSong.lines[lineIndex];
            var html = '';
            if (line.analysis && line.analysis.length) {
                line.analysis.forEach(function(p) {
                    html += '<div class="analysis-point"><strong>' + sanitize(p.point) + '</strong><span>' + sanitize(p.explanation) + '</span></div>';
                });
            } else {
                html = '<p class="text-[#6b6660] text-sm">No additional analysis for this line.</p>';
            }
            content.innerHTML = html;

            // highlight active line
            document.querySelectorAll('.lyric-line').forEach(function(el, idx) {
                el.classList.toggle('active', idx === lineIndex);
            });
        }

        function renderSong(data) {
            currentSong = data;
            var container = document.getElementById('lyrics-column');
            if (!container) return;
            container.innerHTML = '';

            document.title = sanitize(data.title) + ' · LMT Korean';

            // header
            var header = document.createElement('div');
            header.className = 'text-center mb-8 pb-6 border-b border-[#1a1a24]';
            header.innerHTML = `
                <h1 class="text-3xl sm:text-4xl font-light text-[#e4dfd8] tracking-tight">${sanitize(data.title)}</h1>
                <p class="text-[#a09a94] text-base font-light mt-1">${sanitize(data.artist)}</p>
                <div class="mt-4">
                    <button id="copy-btn" class="btn-copy">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy lyrics
                    </button>
                </div>
            `;
            container.appendChild(header);

            // lyrics
            var section = document.createElement('div');
            data.lines.forEach(function(line, idx) {
                if (line.sectionTitle) {
                    var st = document.createElement('div');
                    st.className = 'text-[0.6rem] font-medium tracking-[0.15em] uppercase text-[#6b6660] mt-6 mb-2';
                    st.textContent = line.sectionTitle;
                    section.appendChild(st);
                }

                if (line.korean) {
                    var block = document.createElement('div');
                    block.className = 'lyric-line';
                    block.dataset.index = idx;

                    var koreanP = document.createElement('p');
                    koreanP.className = 'korean-text';
                    koreanP.lang = 'ko';
                    koreanP.textContent = line.korean;
                    block.appendChild(koreanP);

                    var transP = document.createElement('p');
                    transP.className = 'translation-text';
                    transP.textContent = line.translation || '';
                    block.appendChild(transP);

                    // mobile analysis
                    if (line.analysis && line.analysis.length) {
                        var mobileWrap = document.createElement('div');
                        mobileWrap.className = 'analysis-mobile';
                        var inner = '';
                        line.analysis.forEach(function(p) {
                            inner += '<div class="analysis-point"><strong>' + sanitize(p.point) + '</strong><span>' + sanitize(p.explanation) + '</span></div>';
                        });
                        mobileWrap.innerHTML = inner;
                        block.appendChild(mobileWrap);
                    }

                    block.addEventListener('click', function(e) {
                        var idx2 = parseInt(this.dataset.index, 10);
                        if (window.innerWidth < 1024) {
                            // mobile: toggle
                            var mobile = this.querySelector('.analysis-mobile');
                            if (mobile) {
                                var isOpen = mobile.classList.contains('open');
                                // close others
                                document.querySelectorAll('.analysis-mobile.open').forEach(function(el) {
                                    if (el !== mobile) el.classList.remove('open');
                                });
                                document.querySelectorAll('.lyric-line.active').forEach(function(el) {
                                    if (el !== block) el.classList.remove('active');
                                });
                                mobile.classList.toggle('open', !isOpen);
                                block.classList.toggle('active', !isOpen);
                            }
                        } else {
                            // desktop
                            updateDesktopAnalysis(idx2);
                        }
                    });

                    section.appendChild(block);
                }
            });
            container.appendChild(section);

            // key vocabulary
            var vocabPanel = document.getElementById('key-vocab-panel');
            var vocabContent = document.getElementById('key-vocab-content');
            if (data.keyVocabulary && data.keyVocabulary.length) {
                vocabPanel.classList.remove('hidden');
                var html = '';
                data.keyVocabulary.forEach(function(v) {
                    html += '<div class="vocab-item"><span class="ko">' + sanitize(v.korean) + '</span> <span class="detail">' + sanitize(v.chinese) + '</span> <span class="pos">(' + sanitize(v.pos) + ')</span></div>';
                });
                vocabContent.innerHTML = html;
            } else {
                vocabPanel.classList.add('hidden');
            }

            // copy button
            var copyBtn = document.getElementById('copy-btn');
            if (copyBtn) {
                copyBtn.addEventListener('click', function() {
                    var text = data.title + ' - ' + data.artist + '\n\n';
                    data.lines.forEach(function(l) {
                        if (l.sectionTitle) text += '[' + l.sectionTitle + ']\n';
                        if (l.korean) text += l.korean + '\n';
                    });
                    copyLyrics(text.trim(), this);
                });
            }

            // initial desktop analysis
            var firstIdx = data.lines.findIndex(function(l) { return l.korean; });
            if (firstIdx !== -1 && window.innerWidth >= 1024) {
                updateDesktopAnalysis(firstIdx);
            }
        }

        // ——— 初始化 ———
        document.addEventListener('DOMContentLoaded', function() {
            // year
            document.getElementById('year').textContent = new Date().getFullYear();

            // mobile menu
            var toggle = document.getElementById('menu-toggle');
            var menu = document.getElementById('mobile-menu');
            if (toggle && menu) {
                toggle.addEventListener('click', function() {
                    menu.classList.toggle('hidden');
                });
            }

            // get songId
            var params = new URLSearchParams(window.location.search);
            var songId = params.get('songId');
            var container = document.getElementById('lyrics-column');

            if (!songId) {
                container.innerHTML = '<p class="text-center text-red-400/70 text-sm">Error: missing song ID.</p>';
                return;
            }

            var url = new URL('../data/lyrics/' + sanitize(songId) + '.json', window.location.href).href;
            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    renderSong(data);
                })
                .catch(function(err) {
                    console.error(err);
                    container.innerHTML = '<p class="text-center text-red-400/70 text-sm">Failed to load song data.</p>';
                });

            // 視窗尺寸變化時，重新觸發 desktop analysis
            var resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    if (window.innerWidth >= 1024 && currentSong) {
                        var firstIdx = currentSong.lines.findIndex(function(l) { return l.korean; });
                        if (firstIdx !== -1) updateDesktopAnalysis(firstIdx);
                    }
                }, 200);
            });
        });
    </script>
</body>
</html>
