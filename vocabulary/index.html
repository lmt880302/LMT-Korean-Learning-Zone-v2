<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary · LMT Korean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ——— 全域變數 (與首頁一致) ——— */
        :root {
            --bg-primary: #0b0b10;
            --bg-secondary: #111118;
            --bg-card: #181822;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e4dfd8;
            --text-secondary: #a09a94;
            --text-muted: #6b6660;
            --accent-gold: #c9a96e;
            --accent-gold-dim: rgba(201, 169, 110, 0.12);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.45);
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ——— 導航 (與首頁一致) ——— */
        .nav-bar {
            background: rgba(11, 11, 16, 0.75);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border-bottom: 1px solid var(--border-subtle);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
        }

        .nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }
        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        .mobile-nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .mobile-nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .mobile-nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        /* ——— 側邊欄 ——— */
        .sidebar {
            position: sticky;
            top: 85px;
            height: calc(100vh - 100px);
            align-self: start;
        }

        .sidebar-nav-link {
            display: block;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            font-weight: 450;
            font-size: 0.85rem;
            border-left: 2px solid transparent;
            text-decoration: none;
        }
        .sidebar-nav-link:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            transform: translateX(3px);
        }
        .sidebar-nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.05);
            border-left-color: var(--accent-gold);
            font-weight: 500;
        }

        .category-select {
            display: block;
            width: 100%;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            font-weight: 450;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b6660' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            transition: border-color 0.2s;
        }
        .category-select:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        /* ——— 單字卡片 ——— */
        .vocab-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.5rem;
            transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.25s ease;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .vocab-card:hover {
            transform: translateY(-3px);
            border-color: rgba(201, 169, 110, 0.12);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        }

        .korean-word {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 600;
            color: #d4c5a0;
            font-size: 1.6rem;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .chinese-meaning {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
            margin-top: 0.15rem;
        }

        .part-of-speech {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 350;
            margin-left: 0.3rem;
        }

        .audio-button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.2s ease;
            flex-shrink: 0;
            cursor: pointer;
        }
        .audio-button:hover {
            background: rgba(201, 169, 110, 0.08);
            border-color: rgba(201, 169, 110, 0.2);
            color: var(--accent-gold);
        }

        .example-block {
            margin-top: 1rem;
            padding-left: 1rem;
            border-left: 2px solid rgba(201, 169, 110, 0.15);
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .highlight-word {
            color: var(--accent-gold);
            font-weight: 500;
        }

        /* ——— 招呼語卡片 ——— */
        .greeting-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }
        .greeting-item {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-card);
        }
        .greeting-item:hover {
            border-color: rgba(201, 169, 110, 0.1);
            transform: translateY(-2px);
        }
        .greeting-ko {
            font-weight: 500;
            color: #d4c5a0;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 0.2rem;
        }
        .greeting-zh {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ——— 分類標題 ——— */
        .category-title {
            font-weight: 500;
            font-size: 1.6rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.6rem;
            margin-bottom: 1.5rem;
        }

        /* ——— FAB 按鈕 ——— */
        .fab {
            background: var(--accent-gold);
            color: #0b0b10;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 28px rgba(201, 169, 110, 0.2);
            transition: all 0.25s ease;
            text-decoration: none;
        }
        .fab:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 36px rgba(201, 169, 110, 0.3);
        }

        /* ——— 工具 ——— */
        .gold-line {
            width: 40px;
            height: 2px;
            background: var(--accent-gold);
            opacity: 0.4;
            border-radius: 2px;
        }

        .section-label {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ——— 滾動條 ——— */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d3d4a;
        }

        /* ——— 響應式 ——— */
        @media (max-width: 1024px) {
            .sidebar {
                position: relative;
                top: 0;
                height: auto;
                margin-bottom: 2rem;
            }
        }
        @media (max-width: 640px) {
            .vocab-card {
                padding: 1.25rem;
            }
            .korean-word {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <header class="nav-bar">
        <nav class="max-w-6xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <a href="../index.html" class="flex items-center gap-2 text-white font-medium text-sm tracking-tight">
                    <span class="text-[#c9a96e]">◆</span>
                    <span>LMT</span>
                    <span class="text-[#6b6660] font-light text-xs hidden sm:inline">· korean</span>
                </a>

                <div class="hidden md:flex items-center gap-0.5">
                    <a href="../index.html" class="nav-link">Home</a>
                    <a href="../grammar/index.html" class="nav-link">Grammar</a>
                    <a href="./index.html" class="nav-link active">Vocabulary</a>
                    <a href="../songs/index.html" class="nav-link">Lyrics</a>
                </div>

                <button id="menu-toggle" aria-label="Menu" class="md:hidden text-[#a09a94] hover:text-[#e4dfd8] p-1.5 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>

            <div id="mobile-menu" class="md:hidden hidden pb-3 space-y-1">
                <a href="../index.html" class="mobile-nav-link">Home</a>
                <a href="../grammar/index.html" class="mobile-nav-link">Grammar</a>
                <a href="./index.html" class="mobile-nav-link active">Vocabulary</a>
                <a href="../songs/index.html" class="mobile-nav-link">Lyrics</a>
            </div>
        </nav>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="max-w-6xl mx-auto px-6 lg:px-8 pt-20 pb-10">

        <!-- page header -->
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
            <div>
                <span class="section-label">Vocabulary</span>
                <div class="gold-line mt-1.5 mb-2"></div>
                <h1 class="text-2xl sm:text-3xl font-light text-[#e4dfd8] tracking-tight">Essential Words</h1>
                <p class="text-[#6b6660] text-sm font-light mt-0.5">Thematic categories with example sentences</p>
            </div>
            <a href="./flashcards.html" class="fab inline-flex items-center justify-center self-start sm:self-center" title="Flashcards">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
            </a>
        </div>

        <!-- mobile category select (sticky) -->
        <div class="lg:hidden sticky top-16 z-40 bg-[#0b0b10]/90 backdrop-blur py-3 mb-6 -mx-6 px-6 border-b border-[#1a1a24]">
            <select id="category-select-mobile" class="category-select">
                <!-- JS populates -->
            </select>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-[var(--sidebar-width)_1fr] gap-8">

            <!-- SIDEBAR (desktop) -->
            <aside class="hidden lg:block sidebar">
                <div class="flex flex-col h-full">
                    <div class="flex-shrink-0 mb-4">
                        <h3 class="text-xs font-medium uppercase tracking-wider text-[#6b6660] mb-2">Categories</h3>
                        <select id="sidebar-category-select" class="category-select">
                            <!-- JS populates -->
                        </select>
                    </div>
                    <nav id="sidebar-nav" class="flex-grow overflow-y-auto pr-1 space-y-0.5">
                        <!-- JS populates -->
                    </nav>
                </div>
            </aside>

            <!-- CONTENT -->
            <div id="vocabulary-content" class="space-y-12">
                <p class="text-center text-[#6b6660] text-sm">Loading vocabulary...</p>
            </div>

        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="border-t border-[#1a1a24] bg-[#0b0b10] py-7 mt-8">
        <div class="max-w-6xl mx-auto px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p class="text-[#6b6660] text-[0.65rem] font-light tracking-wide">
                &copy; <span id="year"></span> LMT · Korean Learning
            </p>
            <div class="flex items-center gap-5 text-[0.65rem] text-[#6b6660]">
                <a href="#" class="hover:text-[#a09a94] transition">GitHub</a>
                <a href="#" class="hover:text-[#a09a94] transition">Figma</a>
                <a href="#" class="hover:text-[#a09a94] transition">About</a>
            </div>
        </div>
    </footer>

    <script>
        // ——— 核心邏輯 (與原功能一致，僅調整樣式) ———
        let vocabularyData = [];

        function sanitizeHTML(str) {
            if (typeof str !== 'string') return '';
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        function highlightWord(example, word) {
            if (!word || !example) return sanitizeHTML(example);
            const clean = example.replace(/<[^>]*>/g, '');
            const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return clean.replace(new RegExp(`(${escaped})`, 'g'), `<span class="highlight-word">$1</span>`);
        }

        function renderSidebar(data) {
            const nav = document.getElementById('sidebar-nav');
            if (!nav) return;
            nav.innerHTML = '';
            data.forEach(cat => {
                const a = document.createElement('a');
                a.href = `#${cat.id}`;
                a.className = 'sidebar-nav-link';
                a.textContent = cat.category;
                a.dataset.targetId = cat.id;
                nav.appendChild(a);
            });
        }

        function renderSelects(data) {
            const selects = ['category-select-mobile', 'sidebar-category-select'];
            selects.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.innerHTML = '<option value="">— jump to —</option>';
                data.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = `#${cat.id}`;
                    opt.textContent = cat.category;
                    el.appendChild(opt);
                });
            });
        }

        function renderContent(data) {
            const container = document.getElementById('vocabulary-content');
            if (!container) return;
            container.innerHTML = '';

            data.forEach(cat => {
                const section = document.createElement('div');
                section.id = cat.id;
                section.className = 'vocab-category-card';

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = cat.category;
                section.appendChild(title);

                const grid = document.createElement('div');
                if (cat.type === 'greetings') {
                    grid.className = 'greeting-list';
                    cat.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'greeting-item';
                        div.innerHTML = `
                            <span class="greeting-ko">${sanitizeHTML(item.ko)}</span>
                            <span class="greeting-zh">${sanitizeHTML(item.zh)}</span>
                        `;
                        grid.appendChild(div);
                    });
                } else if (cat.type === 'detailed') {
                    grid.className = 'grid grid-cols-1 xl:grid-cols-2 gap-4';
                    cat.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'vocab-card';
                        const exampleHighlight = highlightWord(item.exampleKo, item.korean);
                        card.innerHTML = `
                            <div class="flex items-start justify-between gap-3">
                                <div>
                                    <div class="korean-word">${sanitizeHTML(item.korean)}</div>
                                    <div class="chinese-meaning">
                                        ${sanitizeHTML(item.chinese)}
                                        <span class="part-of-speech">(${sanitizeHTML(item.pos || '')})</span>
                                    </div>
                                </div>
                                <button class="audio-button" aria-label="Play pronunciation">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.828 2.828a1 1 0 011.414 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.414-1.414A3.986 3.986 0 0013 10a3.986 3.986 0 00-1.172-2.828 1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                            <div class="example-block">
                                <p class="text-sm" lang="ko">${exampleHighlight}</p>
                                <p class="text-xs text-[#6b6660] mt-0.5">${sanitizeHTML(item.exampleZh)}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function setupIntersectionObserver() {
            const links = document.querySelectorAll('#sidebar-nav a');
            const sections = document.querySelectorAll('.vocab-category-card');
            if (!links.length || !sections.length) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const link = document.querySelector(`.sidebar-nav-link[data-target-id="${entry.target.id}"]`);
                        if (link) {
                            links.forEach(l => l.classList.remove('active'));
                            link.classList.add('active');
                        }
                    }
                });
            }, { root: null, rootMargin: "-80px 0px -50% 0px", threshold: 0 });

            sections.forEach(s => observer.observe(s));
        }

        function setupSelectNav(selector) {
            const el = document.getElementById(selector);
            if (!el) return;
            el.addEventListener('change', function() {
                const val = this.value;
                if (!val) return;
                const target = document.querySelector(val);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    this.value = '';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 年份
            document.getElementById('year').textContent = new Date().getFullYear();

            // 行動選單
            const toggle = document.getElementById('menu-toggle');
            const menu = document.getElementById('mobile-menu');
            if (toggle && menu) {
                toggle.addEventListener('click', () => menu.classList.toggle('hidden'));
            }

            // 載入資料
            const url = new URL('../data/vocabulary.json', window.location.href).href;
            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    vocabularyData = data;
                    renderSidebar(data);
                    renderSelects(data);
                    renderContent(data);
                    setupIntersectionObserver();
                    setupSelectNav('category-select-mobile');
                    setupSelectNav('sidebar-category-select');
                })
                .catch(err => {
                    document.getElementById('vocabulary-content').innerHTML =
                        `<p class="text-center text-red-400/70 text-sm">Failed to load vocabulary data.</p>`;
                    console.error(err);
                });
        });
    </script>
</body>
</html>
