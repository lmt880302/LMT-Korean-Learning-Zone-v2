<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards · LMT Korean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ——— 全域變數 (與首頁一致) ——— */
        :root {
            --bg-primary: #0b0b10;
            --bg-secondary: #111118;
            --bg-card: #181822;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e4dfd8;
            --text-secondary: #a09a94;
            --text-muted: #6b6660;
            --accent-gold: #c9a96e;
            --accent-gold-dim: rgba(201, 169, 110, 0.12);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ——— 導航 (與首頁一致) ——— */
        .nav-bar {
            background: rgba(11, 11, 16, 0.75);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border-bottom: 1px solid var(--border-subtle);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
        }

        .nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }
        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        .mobile-nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .mobile-nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .mobile-nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        /* ——— 返回按鈕 ——— */
        .back-btn {
            color: var(--text-muted);
            transition: color 0.2s ease;
            text-decoration: none;
        }
        .back-btn:hover {
            color: var(--text-primary);
        }

        /* ——— 控制面板 ——— */
        .controls-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            width: 100%;
            max-width: 520px;
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-card);
        }

        .select-custom {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.5rem 2rem 0.5rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 450;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b6660' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.2em 1.2em;
            transition: border-color 0.2s;
            width: 100%;
            cursor: pointer;
        }
        .select-custom:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        .select-custom:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .checkbox-custom {
            accent-color: var(--accent-gold);
            width: 1rem;
            height: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .checkbox-custom:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(201, 169, 110, 0.2);
        }

        /* ——— 閃卡 ——— */
        .flashcard-scene {
            perspective: 1200px;
            width: 100%;
            max-width: 520px;
            height: 320px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            border-radius: 16px;
            box-shadow: var(--shadow-card);
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.75rem 2rem;
            text-align: center;
            border: 1px solid var(--border-card);
        }

        .flashcard-front {
            background: var(--bg-card);
        }
        .flashcard-front.unfamiliar {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 1px rgba(201, 169, 110, 0.15), var(--shadow-card);
        }

        .flashcard-back {
            background: #1e1e2e;
            transform: rotateY(180deg);
            justify-content: space-around;
        }

        .korean-word {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 3rem;
            font-weight: 600;
            color: #d4c5a0;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .pos-tag {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 0.2rem 0.7rem;
            border-radius: 100px;
            border: 1px solid var(--border-card);
            margin-top: 0.5rem;
        }

        .chinese-meaning {
            font-size: 1.3rem;
            font-weight: 400;
            color: #b8aec8;
        }

        .example-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 90%;
            margin-top: 0.5rem;
        }
        .example-text .highlight {
            color: var(--accent-gold);
            font-weight: 500;
        }

        /* ——— 按鈕 ——— */
        .btn-ctrl {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            padding: 0.6rem 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            flex: 1;
            max-width: 120px;
            text-align: center;
        }
        .btn-ctrl:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .btn-ctrl:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-mark {
            background: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            padding: 0.6rem 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            flex: 1;
            max-width: 120px;
            text-align: center;
        }
        .btn-mark:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }
        .btn-mark.marked {
            color: var(--accent-gold);
            border-color: rgba(201, 169, 110, 0.25);
            background: rgba(201, 169, 110, 0.06);
        }
        .btn-mark.marked:hover:not(:disabled) {
            background: rgba(201, 169, 110, 0.1);
        }
        .btn-mark:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ——— 進度文字 ——— */
        .progress-text {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 400;
            margin-top: 0.75rem;
            letter-spacing: 0.02em;
        }

        /* ——— 標籤 ——— */
        .label-text {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ——— 滾動條 ——— */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d3d4a;
        }

        /* ——— 響應式 ——— */
        @media (max-width: 640px) {
            .flashcard-scene {
                height: 280px;
            }
            .korean-word {
                font-size: 2.4rem;
            }
            .chinese-meaning {
                font-size: 1.1rem;
            }
            .controls-panel {
                padding: 1rem 1.25rem;
            }
            .btn-ctrl,
            .btn-mark {
                font-size: 0.7rem;
                max-width: 90px;
                padding: 0.5rem 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <header class="nav-bar">
        <nav class="max-w-6xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <a href="../index.html" class="flex items-center gap-2 text-white font-medium text-sm tracking-tight">
                    <span class="text-[#c9a96e]">◆</span>
                    <span>LMT</span>
                    <span class="text-[#6b6660] font-light text-xs hidden sm:inline">· korean</span>
                </a>

                <div class="hidden md:flex items-center gap-0.5">
                    <a href="../index.html" class="nav-link">Home</a>
                    <a href="../grammar/index.html" class="nav-link">Grammar</a>
                    <a href="./index.html" class="nav-link active">Vocabulary</a>
                    <a href="../songs/index.html" class="nav-link">Lyrics</a>

                <button id="menu-toggle" aria-label="Menu" class="md:hidden text-[#a09a94] hover:text-[#e4dfd8] p-1.5 transition">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>

            <div id="mobile-menu" class="md:hidden hidden pb-3 space-y-1">
                <a href="../index.html" class="mobile-nav-link">Home</a>
                <a href="../grammar/index.html" class="mobile-nav-link">Grammar</a>
                <a href="./index.html" class="mobile-nav-link active">Vocabulary</a>
                <a href="../songs/index.html" class="mobile-nav-link">Lyrics</a>
            </div>
        </nav>
    </header>

    <!-- ===== BACK BUTTON ===== -->
    <a href="./index.html" class="back-btn fixed top-20 left-4 md:top-24 md:left-8 z-40 p-1.5 transition" title="Back to vocabulary list">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z" />
        </svg>
    </a>

    <!-- ===== MAIN ===== -->
    <main class="max-w-6xl mx-auto px-6 lg:px-8 pt-20 pb-10 w-full">
        <!-- header -->
        <div class="text-center mb-8">
            <span class="text-[0.6rem] font-medium tracking-[0.15em] uppercase text-[#6b6660]">Practice</span>
            <div class="w-10 h-[2px] bg-[#c9a96e] opacity-40 mx-auto mt-1.5 mb-2 rounded"></div>
            <h1 class="text-2xl sm:text-3xl font-light text-[#e4dfd8] tracking-tight">Flashcards</h1>
            <p class="text-[#6b6660] text-sm font-light mt-0.5">Tap to flip · mark unfamiliar words</p>
        </div>

        <!-- controls -->
        <div class="controls-panel mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                <div class="flex-1">
                    <label for="category-select" class="label-text block mb-1">Category</label>
                    <select id="category-select" class="select-custom">
                        <option value="all">— All words —</option>
                    </select>
                </div>
                <div class="flex items-center gap-3 pt-1 sm:pt-0">
                    <input type="checkbox" id="unfamiliar-toggle" class="checkbox-custom" />
                    <label for="unfamiliar-toggle" class="text-[0.75rem] font-medium text-[#6b6660] cursor-pointer select-none">
                        Unfamiliar only
                    </label>
                </div>
            </div>
        </div>

        <!-- flashcard -->
        <div class="flashcard-scene" id="flashcard-scene">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-face flashcard-front" id="flashcard-front">
                    <p class="text-[#6b6660] text-sm">Loading...</p>
                </div>
                <div class="flashcard-face flashcard-back" id="flashcard-back"></div>
            </div>
        </div>

        <!-- controls -->
        <div class="flex items-center justify-center gap-3 mt-5 w-full max-w-[520px]">
            <button id="prev-btn" class="btn-ctrl">Previous</button>
            <button id="mark-btn" class="btn-mark">Mark</button>
            <button id="next-btn" class="btn-ctrl">Next</button>
        </div>
        <p class="progress-text" id="progress-text">0 / 0</p>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="border-t border-[#1a1a24] bg-[#0b0b10] py-7 mt-4">
        <div class="max-w-6xl mx-auto px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p class="text-[#6b6660] text-[0.65rem] font-light tracking-wide">
                &copy; <span id="year"></span> LMT · Korean Learning
            </p>
            <div class="flex items-center gap-5 text-[0.65rem] text-[#6b6660]">
                <a href="#" class="hover:text-[#a09a94] transition">L</a>
                <a href="#" class="hover:text-[#a09a94] transition">M</a>
                <a href="#" class="hover:text-[#a09a94] transition">T</a>
            </div>
        </div>
    </footer>

    <script>
        // ——— 核心邏輯 (功能完全保留，僅樣式統一) ———
        var vocabularyData = [];
        var allCards = [];
        var currentDeck = [];
        var currentIndex = 0;
        var isFlipped = false;
        var selectedCategory = "all";
        var unfamiliarOnly = false;

        var flashcardEl = document.getElementById('flashcard');
        var frontEl = document.getElementById('flashcard-front');
        var backEl = document.getElementById('flashcard-back');
        var prevBtn = document.getElementById('prev-btn');
        var markBtn = document.getElementById('mark-btn');
        var nextBtn = document.getElementById('next-btn');
        var progressEl = document.getElementById('progress-text');
        var categorySelect = document.getElementById('category-select');
        var unfamiliarToggle = document.getElementById('unfamiliar-toggle');

        function sanitize(str) {
            if (typeof str !== 'string') return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function highlightExample(example, word) {
            if (!word || !example) return sanitize(example);
            var clean = example.replace(/<[^>]*>/g, '');
            var escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return clean.replace(new RegExp('(' + escaped + ')', 'g'), '<span class="highlight">$1</span>');
        }

        function loadMarkings() {
            var stored = localStorage.getItem('lmt_flashcard_marks');
            return stored ? JSON.parse(stored) : {};
        }

        function saveMarkings(marks) {
            localStorage.setItem('lmt_flashcard_marks', JSON.stringify(marks));
        }

        function prepareAllCards(data) {
            var marks = loadMarkings();
            allCards = [];
            data.forEach(function(cat) {
                if (cat.type === 'detailed' && cat.items) {
                    cat.items.forEach(function(item) {
                        if (item.korean && item.chinese) {
                            allCards.push({
                                korean: item.korean,
                                chinese: item.chinese,
                                pos: item.pos || '',
                                exampleKo: item.exampleKo || '',
                                exampleZh: item.exampleZh || '',
                                categoryId: cat.id,
                                marked: !!marks[item.korean]
                            });
                        }
                    });
                }
            });
        }

        function buildDeck() {
            var pool = allCards.slice();
            if (unfamiliarOnly) {
                pool = pool.filter(function(c) { return c.marked; });
            } else if (selectedCategory !== 'all') {
                pool = pool.filter(function(c) { return c.categoryId === selectedCategory; });
            }
            // shuffle
            for (var i = pool.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = pool[i];
                pool[i] = pool[j];
                pool[j] = tmp;
            }
            currentDeck = pool;
            currentIndex = 0;
            isFlipped = false;
            if (flashcardEl) flashcardEl.classList.remove('is-flipped');
            renderCard();
        }

        function renderCard() {
            if (!frontEl || !backEl || !markBtn) return;

            if (currentDeck.length === 0) {
                var msg = 'No words match.';
                if (unfamiliarOnly) msg = 'No unfamiliar words — great job!';
                frontEl.innerHTML = '<p class="text-[#6b6660] text-sm">' + msg + '</p>';
                backEl.innerHTML = '';
                markBtn.textContent = 'Mark';
                markBtn.classList.remove('marked');
                frontEl.classList.remove('unfamiliar');
                updateProgress();
                updateButtons();
                return;
            }

            var card = currentDeck[currentIndex];
            var exampleHighlight = highlightExample(card.exampleKo, card.korean);
            var posHtml = card.pos ? '<span class="pos-tag">' + sanitize(card.pos) + '</span>' : '';

            frontEl.innerHTML = '<div class="korean-word" lang="ko">' + sanitize(card.korean) + '</div>';
            frontEl.classList.toggle('unfamiliar', card.marked);

            backEl.innerHTML = `
                <div class="chinese-meaning">${sanitize(card.chinese)}</div>
                ${posHtml}
                <div class="example-text">
                    <p lang="ko">${exampleHighlight}</p>
                    <p class="text-[#6b6660] text-[0.7rem] mt-0.5">${sanitize(card.exampleZh)}</p>
                </div>
            `;

            if (card.marked) {
                markBtn.textContent = 'Unmark';
                markBtn.classList.add('marked');
            } else {
                markBtn.textContent = 'Mark';
                markBtn.classList.remove('marked');
            }

            updateProgress();
            updateButtons();
        }

        function updateProgress() {
            if (currentDeck.length > 0) {
                progressEl.textContent = (currentIndex + 1) + ' / ' + currentDeck.length;
            } else {
                progressEl.textContent = '0 / 0';
            }
        }

        function updateButtons() {
            var len = currentDeck.length;
            prevBtn.disabled = len === 0 || currentIndex === 0;
            nextBtn.disabled = len === 0 || currentIndex === len - 1;
            markBtn.disabled = len === 0;
        }

        function flipCard() {
            if (currentDeck.length === 0) return;
            isFlipped = !isFlipped;
            flashcardEl.classList.toggle('is-flipped', isFlipped);
        }

        function toggleMark() {
            if (currentDeck.length === 0) return;
            var card = currentDeck[currentIndex];
            card.marked = !card.marked;

            // 同步到 allCards
            var master = allCards.find(function(c) { return c.korean === card.korean; });
            if (master) master.marked = card.marked;

            // 保存
            var marks = {};
            allCards.forEach(function(c) { marks[c.korean] = c.marked; });
            saveMarkings(marks);

            renderCard();
        }

        function nextCard() {
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
                isFlipped = false;
                flashcardEl.classList.remove('is-flipped');
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                isFlipped = false;
                flashcardEl.classList.remove('is-flipped');
                renderCard();
            }
        }

        function populateCategories(data) {
            var seen = {};
            var opts = '<option value="all">— All words —</option>';
            data.forEach(function(cat) {
                if (cat.type === 'detailed' && cat.id && cat.category && !seen[cat.id]) {
                    seen[cat.id] = true;
                    opts += '<option value="' + cat.id + '">' + sanitize(cat.category) + '</option>';
                }
            });
            categorySelect.innerHTML = opts;
        }

        function init(data) {
            vocabularyData = data;
            populateCategories(data);
            prepareAllCards(data);
            buildDeck();
        }

        // ——— 事件綁定 ———
        document.addEventListener('DOMContentLoaded', function() {
            // 年份
            document.getElementById('year').textContent = new Date().getFullYear();

            // 行動選單
            var toggle = document.getElementById('menu-toggle');
            var menu = document.getElementById('mobile-menu');
            if (toggle && menu) {
                toggle.addEventListener('click', function() {
                    menu.classList.toggle('hidden');
                });
            }

            // 載入資料
            var url = new URL('../data/vocabulary.json', window.location.href).href;
            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    init(data);
                })
                .catch(function(err) {
                    console.error(err);
                    frontEl.innerHTML = '<p class="text-red-400/70 text-sm">Failed to load vocabulary.</p>';
                });

            // 事件
            if (flashcardEl) flashcardEl.addEventListener('click', flipCard);
            if (prevBtn) prevBtn.addEventListener('click', prevCard);
            if (nextBtn) nextBtn.addEventListener('click', nextCard);
            if (markBtn) markBtn.addEventListener('click', toggleMark);

            if (categorySelect) {
                categorySelect.addEventListener('change', function() {
                    selectedCategory = this.value;
                    buildDeck();
                });
            }

            if (unfamiliarToggle) {
                unfamiliarToggle.addEventListener('change', function() {
                    unfamiliarOnly = this.checked;
                    if (categorySelect) categorySelect.disabled = unfamiliarOnly;
                    buildDeck();
                });
            }
        });
    </script>
</body>
</html>
