<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar · LMT Korean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ——— 全域變數 (與首頁一致) ——— */
        :root {
            --bg-primary: #0b0b10;
            --bg-secondary: #111118;
            --bg-card: #181822;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e4dfd8;
            --text-secondary: #a09a94;
            --text-muted: #6b6660;
            --accent-gold: #c9a96e;
            --accent-gold-dim: rgba(201, 169, 110, 0.12);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        /* ——— 導航 (與首頁一致) ——— */
        .nav-bar {
            background: rgba(11, 11, 16, 0.75);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border-bottom: 1px solid var(--border-subtle);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
        }

        .nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }
        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        .mobile-nav-link {
            color: var(--text-secondary);
            font-weight: 450;
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .mobile-nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .mobile-nav-link.active {
            color: var(--text-primary);
            background: rgba(201, 169, 110, 0.07);
        }

        /* ——— 標籤與裝飾 ——— */
        .gold-line {
            width: 40px;
            height: 2px;
            background: var(--accent-gold);
            opacity: 0.4;
            border-radius: 2px;
        }

        .section-label {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ——— 分類選擇器 ——— */
        .selector-wrap {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            max-width: 480px;
            margin: 0 auto 2.5rem auto;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(8px);
        }

        .select-custom {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.6rem 2rem 0.6rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 450;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b6660' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.2em 1.2em;
            transition: border-color 0.2s;
            width: 100%;
            cursor: pointer;
        }
        .select-custom:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        /* ——— 分類標題 ——— */
        .category-heading {
            font-weight: 500;
            font-size: 1.6rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.6rem;
            margin-bottom: 1.5rem;
            scroll-margin-top: 100px;
        }

        .subcategory-heading {
            font-weight: 450;
            font-size: 1.2rem;
            color: #d4c5a0;
            border-bottom: 1px dashed var(--border-subtle);
            padding-bottom: 0.4rem;
            margin: 2rem 0 1.25rem 0;
            scroll-margin-top: 100px;
        }

        /* ——— 文法卡片 ——— */
        .grammar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.5rem 1.5rem 1.25rem;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-card);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .grammar-card:hover {
            transform: translateY(-3px);
            border-color: rgba(201, 169, 110, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        }

        .rule-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #d4c5a0;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .rule-detail {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
            flex: 1;
        }
        .rule-detail strong {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: inline-block;
            min-width: 48px;
        }
        .rule-detail .ko {
            font-family: 'Noto Sans KR', sans-serif;
            color: #d4c5a0;
            font-weight: 450;
        }
        .rule-detail .highlight {
            color: var(--accent-gold);
        }

        /* ——— 空狀態 ——— */
        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 3rem 0;
            font-size: 0.9rem;
        }

        /* ——— 滾動條 ——— */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d3d4a;
        }

        /* ——— 響應式 ——— */
        @media (max-width: 640px) {
            .selector-wrap {
                padding: 0.75rem 1rem;
                margin-bottom: 1.5rem;
            }
            .grammar-card {
                padding: 1.25rem 1rem;
            }
            .category-heading {
                font-size: 1.3rem;
            }
            .rule-title {
                font-size: 0.95rem;
            }
            .rule-detail {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <header class="nav-bar">
        <nav class="max-w-6xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <a href="../index.html" class="flex items-center gap-2 text-white font-medium text-sm tracking-tight">
                    <span class="text-[#c9a96e]">◆</span>
                    <span>LMT</span>
                    <span class="text-[#6b6660] font-light text-xs hidden sm:inline">· korean</span>
                </a>

                <div class="hidden md:flex items-center gap-0.5">
                    <a href="../index.html" class="nav-link">Home</a>
                    <a href="./index.html" class="nav-link active">Grammar</a>
                    <a href="../vocabulary/index.html" class="nav-link">Vocabulary</a>
                    <a href="../songs/index.html" class="nav-link">Lyrics</a>
                </div>

                <button id="menu-toggle" aria-label="Menu" class="md:hidden text-[#a09a94] hover:text-[#e4dfd8] p-1.5 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>

            <div id="mobile-menu" class="md:hidden hidden pb-3 space-y-1">
                <a href="../index.html" class="mobile-nav-link">Home</a>
                <a href="./index.html" class="mobile-nav-link active">Grammar</a>
                <a href="../vocabulary/index.html" class="mobile-nav-link">Vocabulary</a>
                <a href="../songs/index.html" class="mobile-nav-link">Lyrics</a>
            </div>
        </nav>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="max-w-6xl mx-auto px-6 lg:px-8 pt-20 pb-10 w-full">

        <!-- page header -->
        <div class="text-center mb-8">
            <span class="section-label">Reference</span>
            <div class="gold-line mx-auto mt-1.5 mb-2"></div>
            <h1 class="text-2xl sm:text-3xl font-light text-[#e4dfd8] tracking-tight">Grammar Overview</h1>
            <p class="text-[#6b6660] text-sm font-light mt-0.5">Structured rules with examples and memory aids</p>
        </div>

        <!-- category selector -->
        <div class="selector-wrap">
            <select id="grammar-unit-select" class="select-custom">
                <option value="">— Jump to category —</option>
            </select>
        </div>

        <!-- grammar content -->
        <div id="grammar-container" class="space-y-12">
            <p class="text-center text-[#6b6660] text-sm">Loading grammar data...</p>
        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="border-t border-[#1a1a24] bg-[#0b0b10] py-7 mt-8">
        <div class="max-w-6xl mx-auto px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p class="text-[#6b6660] text-[0.65rem] font-light tracking-wide">
                &copy; <span id="year"></span> LMT · Korean Learning
            </p>
            <div class="flex items-center gap-5 text-[0.65rem] text-[#6b6660]">
                <a href="#" class="hover:text-[#a09a94] transition">L</a>
                <a href="#" class="hover:text-[#a09a94] transition">M</a>
                <a href="#" class="hover:text-[#a09a94] transition">T</a>
            </div>
        </div>
    </footer>

    <script>
        // ——— 核心邏輯 (功能保留，樣式全新) ———
        var grammarData = [];

        function sanitize(str) {
            if (typeof str !== 'string') return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function formatKorean(text) {
            if (typeof text !== 'string') return sanitize(text);
            return text.replace(
                /([\u3131-\uD79D]+(?:[\s\(\)、，。：]\s*[\u3131-\uD79D]+)*|[（(][\u3131-\uD79D\s（）、，。：]+[）)])/g,
                '<span class="ko">$1</span>'
            );
        }

        function createRuleCard(rule) {
            var card = document.createElement('div');
            card.className = 'grammar-card';

            var title = document.createElement('div');
            title.className = 'rule-title';
            title.innerHTML = sanitize(rule.rule);
            card.appendChild(title);

            var detail = document.createElement('div');
            detail.className = 'rule-detail';

            var fields = [
                { key: 'description', label: 'Meaning' },
                { key: 'example', label: 'Example' },
                { key: 'words', label: 'Vocab' },
                { key: 'memory', label: 'Memo' }
            ];

            fields.forEach(function(f) {
                if (rule[f.key]) {
                    var p = document.createElement('p');
                    var formatted = f.key === 'example' || f.key === 'words' ?
                        formatKorean(sanitize(rule[f.key])) :
                        sanitize(rule[f.key]);
                    p.innerHTML = '<strong>' + f.label + '</strong> ' + formatted;
                    detail.appendChild(p);
                }
            });

            card.appendChild(detail);
            return card;
        }

        function renderGrammar(data) {
            var container = document.getElementById('grammar-container');
            var select = document.getElementById('grammar-unit-select');
            if (!container || !select) return;

            container.innerHTML = '';
            // keep only placeholder
            while (select.options.length > 1) select.remove(1);

            data.forEach(function(category) {
                // add to select
                var opt = document.createElement('option');
                opt.value = category.id;
                opt.textContent = category.category;
                select.appendChild(opt);

                // section
                var section = document.createElement('section');
                section.id = category.id;
                section.className = 'mb-14';

                var heading = document.createElement('h2');
                heading.className = 'category-heading';
                heading.textContent = category.category;
                section.appendChild(heading);

                var grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4';

                // rules
                if (category.rules) {
                    category.rules.forEach(function(rule) {
                        grid.appendChild(createRuleCard(rule));
                    });
                }

                // subcategories
                if (category.subcategories) {
                    category.subcategories.forEach(function(sub) {
                        var subHeading = document.createElement('h3');
                        subHeading.className = 'subcategory-heading col-span-full';
                        subHeading.textContent = sub.name || 'Subcategory';
                        if (sub.id) subHeading.id = sub.id;
                        grid.appendChild(subHeading);

                        if (sub.rules) {
                            sub.rules.forEach(function(rule) {
                                grid.appendChild(createRuleCard(rule));
                            });
                        }
                    });
                }

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function setupSelector() {
            var select = document.getElementById('grammar-unit-select');
            if (!select) return;

            select.addEventListener('change', function() {
                var val = this.value;
                if (!val) return;
                var target = document.getElementById(val);
                if (target) {
                    var headerH = document.querySelector('.nav-bar')?.offsetHeight || 0;
                    var selectorH = document.querySelector('.selector-wrap')?.offsetHeight || 0;
                    var offset = headerH + selectorH + 24;
                    var pos = target.getBoundingClientRect().top + window.pageYOffset - offset;
                    window.scrollTo({ top: pos, behavior: 'smooth' });
                    this.value = '';
                }
            });
        }

        // ——— 初始化 ———
        document.addEventListener('DOMContentLoaded', function() {
            // year
            document.getElementById('year').textContent = new Date().getFullYear();

            // mobile menu
            var toggle = document.getElementById('menu-toggle');
            var menu = document.getElementById('mobile-menu');
            if (toggle && menu) {
                toggle.addEventListener('click', function() {
                    menu.classList.toggle('hidden');
                });
            }

            // load data
            var container = document.getElementById('grammar-container');
            var url = new URL('../data/grammar.json', window.location.href).href;
            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    grammarData = data;
                    renderGrammar(data);
                    setupSelector();
                })
                .catch(function(err) {
                    console.error(err);
                    container.innerHTML = '<p class="empty-state">Failed to load grammar data.</p>';
                });
        });
    </script>
</body>
</html>
